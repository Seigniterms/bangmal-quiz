<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --pink:#ff8fab; --pink-deep:#fb6f92; --pink-soft:#ffc2d1; --pink-bg:#fff0f3;
    --brown:#5c4a4a; --gold:#ffb703; --purple:#b565d8;
  }
  body {
    font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;
    background:linear-gradient(160deg,#ffe5ec 0%,#fff0f3 45%,#fff8f0 100%);
    min-height:100vh; color:var(--brown); overflow-x:hidden;
    display:flex; justify-content:center;
  }
  #app { width:100%; max-width:520px; padding:20px 16px 60px; position:relative; z-index:2; }
  .floating-hearts { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .floating-hearts span { position:absolute; bottom:-40px; font-size:20px; opacity:.35; animation:floatUp linear infinite; }
  @keyframes floatUp {
    0% { transform:translateY(0) rotate(0deg); opacity:0; } 10% { opacity:.4; }
    90% { opacity:.35; } 100% { transform:translateY(-110vh) rotate(30deg); opacity:0; }
  }
  .card-box {
    background:rgba(255,255,255,.92); border-radius:28px; padding:28px 22px;
    box-shadow:0 8px 32px rgba(251,111,146,.18), 0 2px 8px rgba(251,111,146,.10);
    backdrop-filter:blur(6px);
  }
  .screen { display:none; animation:pop .35s ease; }
  .screen.active { display:block; }
  @keyframes pop { from { transform:scale(.96) translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
  h1 { text-align:center; font-size:26px; margin:14px 0 6px; color:var(--pink-deep); letter-spacing:-.5px; }
  .title-emoji { font-size:56px; text-align:center; animation:beat 1.4s ease infinite; }
  @keyframes beat { 0%,100%{transform:scale(1);} 12%{transform:scale(1.15);} 24%{transform:scale(1);} 36%{transform:scale(1.12);} 48%{transform:scale(1);} }
  .subtitle { text-align:center; font-size:14px; color:#a17887; line-height:1.7; margin-bottom:22px; }
  .btn {
    display:block; width:100%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--pink) 0%,var(--pink-deep) 100%);
    color:#fff; font-size:18px; font-weight:700; padding:16px;
    border-radius:999px; box-shadow:0 6px 18px rgba(251,111,146,.45);
    transition:transform .12s ease; font-family:inherit;
  }
  .btn:active { transform:scale(.96); }
  .btn.secondary { background:#fff; color:var(--pink-deep); border:2px solid var(--pink-soft); box-shadow:none; }

  /* 진행바 */
  .progress-wrap { margin-bottom:16px; }
  .progress-label { display:flex; justify-content:space-between; font-size:13px; color:#b0828f; margin-bottom:6px; font-weight:600; }
  .progress-bar { height:12px; background:#ffe0e8; border-radius:999px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--purple),var(--pink-deep)); transition:width .4s ease; }

  /* 선택지 */
  .opt {
    display:block; width:100%; background:#fff; border:3px solid var(--pink-soft);
    border-radius:22px; padding:22px 18px; cursor:pointer; font-family:inherit;
    font-size:17px; font-weight:700; color:var(--brown); line-height:1.55;
    transition:all .15s ease; text-align:center; word-break:keep-all;
  }
  .opt:hover { border-color:var(--pink); background:var(--pink-bg); transform:translateY(-2px); box-shadow:0 8px 20px rgba(251,111,146,.2); }
  .opt.picked-a { border-color:var(--purple); background:#f6edff; }
  .opt.picked-b { border-color:var(--pink-deep); background:var(--pink-bg); }
  .opt.other { opacity:.45; }
  .opt:disabled { cursor:default; transform:none; }
  .vs { text-align:center; font-size:20px; font-weight:900; color:var(--pink-deep); margin:10px 0; }

  /* 투표 결과 */
  .vote-result { display:none; margin-top:18px; }
  .vote-result.show { display:block; animation:pop .3s ease; }
  .verdict { text-align:center; font-size:18px; font-weight:800; margin-bottom:12px; }
  .split-bar { display:flex; height:34px; border-radius:999px; overflow:hidden; font-weight:800; font-size:14px; box-shadow:inset 0 2px 6px rgba(0,0,0,.08); }
  .split-a { background:linear-gradient(90deg,var(--purple),#c77dff); color:#fff; display:flex; align-items:center; justify-content:center; transition:width .8s cubic-bezier(.2,.8,.2,1); min-width:44px; }
  .split-b { background:linear-gradient(90deg,var(--pink),var(--pink-deep)); color:#fff; display:flex; align-items:center; justify-content:center; transition:width .8s cubic-bezier(.2,.8,.2,1); min-width:44px; }
  .split-label { display:flex; justify-content:space-between; font-size:12px; color:#b0828f; margin-top:5px; }
  .reactions { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .react-bubble { display:flex; gap:10px; align-items:flex-start; background:var(--pink-bg); border-radius:16px; padding:10px 14px; animation:pop .3s ease; }
  .react-emoji { font-size:22px; flex-shrink:0; }
  .react-name { font-size:12px; font-weight:800; color:var(--pink-deep); margin-bottom:2px; }
  .react-text { font-size:14px; line-height:1.5; }
  .next-btn { margin-top:16px; display:none; }
  .next-btn.show { display:block; }

  /* 결과 */
  .result-title { text-align:center; font-size:20px; font-weight:800; margin:8px 0 4px; }
  .result-champ { text-align:center; font-size:28px; font-weight:900; color:var(--pink-deep); margin:4px 0 10px; }
  .result-sub { text-align:center; font-size:14px; color:#a17887; line-height:1.7; margin-bottom:16px; }
  .align-list { display:flex; flex-direction:column; gap:8px; margin:14px 0 20px; }
  .align-row { display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--pink-soft); border-radius:16px; padding:10px 14px; }
  .align-row.top { border-color:var(--gold); background:linear-gradient(90deg,#fffaf0,#fff); }
  .align-emoji { font-size:22px; }
  .align-name { font-weight:800; font-size:14px; flex:1; }
  .align-bar-wrap { flex:2; height:10px; background:#ffe0e8; border-radius:999px; overflow:hidden; }
  .align-bar { height:100%; background:linear-gradient(90deg,var(--pink),var(--pink-deep)); border-radius:999px; }
  .align-pct { font-size:13px; font-weight:800; color:var(--pink-deep); width:42px; text-align:right; }
  .reveal-list { display:none; flex-direction:column; gap:8px; margin-top:12px; }
  .reveal-list.show { display:flex; animation:pop .35s ease; }
  .reveal-row { display:flex; align-items:center; gap:8px; background:var(--pink-bg); border-radius:14px; padding:9px 14px; font-size:14px; }
  .reveal-row .r-alias { font-size:20px; }
  .reveal-row .r-eq { font-weight:900; color:var(--pink-deep); }

  .reveal-row .r-n { font-size:12px; font-weight:700; color:#b0828f; }
  .btn-row { display:flex; flex-direction:column; gap:10px; }
  .toast {
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:var(--brown); color:#fff; padding:12px 22px; border-radius:999px;
    font-size:14px; font-weight:600; opacity:0; transition:opacity .3s; z-index:99; pointer-events:none;
  }

<div class="floating-hearts" id="hearts"></div>

        <button class="btn secondary" onclick="location.href='worldcup.html'">💘 이상형 월드컵 1탄</button>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast">복사 완료! 방에 붙여넣기 ㄱㄱ 😈</div>

const SHARE_URL = 'https://bangmal-quiz.vercel.app/balance.html';
const ANON = ['🦊','🐸','🐵','🐰','🐻','🦉','🐢','🦖','🐳','🦄'];
DATA.members.forEach((m,i)=>m.alias=ANON[i%ANON.length]);
const aliasOf = name => (DATA.members.find(m=>m.name===name)||{}).alias || '🎭';

let order = [], cur = 0, answers = [], lock = false;
let sameCount = {}; // member -> 같이 고른 횟수
let minority = 0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

(function(){
  const box = document.getElementById('hearts');
  const emo = ['😈','💜','🩷','💖','✨','🔥'];
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.textContent = emo[i%emo.length];
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (9+Math.random()*10)+'s';
    s.style.animationDelay = (-Math.random()*12)+'s';
    s.style.fontSize = (14+Math.random()*18)+'px';
    box.appendChild(s);
  }
})();

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startGame(){
  order = shuffle(DATA.questions.map((q,i)=>i));
  cur = 0; answers = []; minority = 0;
  sameCount = {};
  DATA.members.forEach(m=>sameCount[m.name]=0);
  show('screen-quiz');
  renderQ();
}

function renderQ(){
  lock = false;
  const q = DATA.questions[order[cur]];
  document.getElementById('q-num').textContent = `${cur+1} / ${order.length}`;
  const pct = Math.round(cur/order.length*100);
  document.getElementById('q-pct').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
  const oa = document.getElementById('opt-a'), ob = document.getElementById('opt-b');
  oa.textContent = q.a; ob.textContent = q.b;
  oa.className = 'opt'; ob.className = 'opt';
  oa.disabled = false; ob.disabled = false;
  document.getElementById('vote-result').className = 'vote-result';
  document.getElementById('next-btn').className = 'btn next-btn';
  document.getElementById('split-a').style.width = '50%';
  document.getElementById('split-b').style.width = '50%';
}

function pick(side){
  if(lock) return;
  lock = true;
  const q = DATA.questions[order[cur]];
  answers.push(side);
  const oa = document.getElementById('opt-a'), ob = document.getElementById('opt-b');
  oa.disabled = true; ob.disabled = true;
  (side==='a'?oa:ob).classList.add(side==='a'?'picked-a':'picked-b');
  (side==='a'?ob:oa).classList.add('other');

  // 다수/소수 판정 + 멤버 싱크 집계
  const myVotes = side==='a' ? q.votesA : q.votesB;
  const majoritySide = q.votesA >= q.votesB ? 'a' : 'b';
  if(q.votesA === q.votesB){
    document.getElementById('verdict').innerHTML = '⚖️ <b>5:5 완전 반반!</b> 너의 선택이 방을 가른다';
  } else if(side === majoritySide){
    document.getElementById('verdict').innerHTML = '😎 <b>다수파!</b> 방 멤버 대부분과 같은 선택';
  } else {
    minority++;
    document.getElementById('verdict').innerHTML = '😈 <b>소수파!</b> 너만의 길을 가는 스타일';
  }
  q.reactions.forEach(r=>{ if(r.side===side) sameCount[r.member]++; });

  // 투표 바 애니메이션
  const pa = q.votesA*10, pb = q.votesB*10;
  document.getElementById('vote-result').classList.add('show');
  requestAnimationFrame(()=>{ setTimeout(()=>{
    document.getElementById('split-a').style.width = Math.max(pa,8)+'%';
    document.getElementById('split-b').style.width = Math.max(pb,8)+'%';
    document.getElementById('split-a').textContent = pa+'%';
    document.getElementById('split-b').textContent = pb+'%';
    document.getElementById('split-nums').textContent = `${q.votesA}표 vs ${q.votesB}표`;
  }, 50); });

  // 반응 멘트: 내 편 1명 + 반대편 1명 랜덤 (없으면 내 편 2명) — 이름은 익명 🤫
  const mine = shuffle(q.reactions.filter(r=>r.side===side));
  const theirs = shuffle(q.reactions.filter(r=>r.side!==side));
  const picked = [];
  if(mine.length) picked.push({r:mine[0], tag:'같은 편 💜'});
  if(theirs.length) picked.push({r:theirs[0], tag:'반대편 😤'});
  if(picked.length<2 && mine.length>1) picked.push({r:mine[1], tag:'같은 편 💜'});
  document.getElementById('reactions').innerHTML = picked.map(p=>`
    <div class="react-bubble">
      <div class="react-emoji">${aliasOf(p.r.member)}</div>
      <div><div class="react-name">익명 ${aliasOf(p.r.member)} · ${p.tag}</div><div class="react-text">${p.r.text}</div></div>
    </div>`).join('');

  const nb = document.getElementById('next-btn');
  nb.classList.add('show');
  nb.textContent = cur===order.length-1 ? '😈 결과 보기' : '다음 문제 ➜';
}

function nextQ(){
  cur++;
  if(cur>=order.length){ showResult(); return; }
  renderQ();
}

function minorityTitle(n){
  if(n<=3) return ['🕊️','다수의 편에 서는 평화주의자','방 사람들이랑 생각이 꽤 비슷한 편! 물 흐르듯 어울리는 타입'];
  if(n<=6) return ['⚖️','밸런스의 달인','다수와 소수를 오가는 너, 사실 제일 정상일지도?'];
  if(n<=9) return ['😈','소수파 반골','남들이 A면 B를 고르는 너! 방의 개성 담당'];
  return ['🔥','전설의 아웃사이더','10표 중 0표 선택지를 두 번이나 고른 너... 존경합니다'];
}

function showResult(){
  const ranking = DATA.members.map(m=>({...m, n: sameCount[m.name]})).sort((x,y)=>y.n-x.n);
  const top = ranking[0];
  const pct = Math.round(top.n/order.length*100);
  const [emo, title, desc] = minorityTitle(minority);
  document.getElementById('result-emoji').textContent = emo;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-champ').textContent = `당신은 ${top.emoji} ${top.name.split(' ')[0]}파!`;
  document.getElementById('result-sub').innerHTML =
    `20문제 중 <b>${top.n}개</b>를 ${top.name}와 같은 선택 (${pct}%)<br>` +
    `소수 선택 <b>${minority}번</b> — ${desc}`;
  document.getElementById('align-list').innerHTML = ranking.slice(0,5).map((m,i)=>`
    <div class="align-row ${i===0?'top':''}">
      <span class="align-emoji">${m.emoji}</span>
      <span class="align-name">${m.name}</span>
      <span class="align-bar-wrap"><span class="align-bar" style="display:block;width:${Math.round(m.n/order.length*100)}%"></span></span>
      <span class="align-pct">${m.n}개</span>
    </div>`).join('');
  document.getElementById('reveal-list').className = 'reveal-list';
  document.getElementById('reveal-list').innerHTML = '';
  document.getElementById('reveal-btn').style.display = '';
  show('screen-result');
}

function revealIdentities(){
  const el = document.getElementById('reveal-list');
  el.innerHTML = [...DATA.members].sort((x,y)=>sameCount[y.name]-sameCount[x.name]).map(m=>`
    <div class="reveal-row">
      <span class="r-alias">${m.alias}</span>
      <span class="r-eq">=</span>
      <span class="r-alias">${m.emoji}</span>
      <span class="r-name">${m.name}</span>
      <span class="r-n">${sameCount[m.name]}개 일치</span>
    </div>`).join('');
  el.classList.add('show');
  document.getElementById('reveal-btn').style.display = 'none';
}

function copyResult(){
  const ranking = DATA.members.map(m=>({...m, n: sameCount[m.name]})).sort((x,y)=>y.n-x.n);
  const top = ranking[0];
  const [emo, title] = minorityTitle(minority);
  const text = `😈 반말방 밸런스 게임 1탄\n${emo} ${title}\n나는 ${top.emoji} ${top.name}파! (20문제 중 ${top.n}개 일치)\n소수 선택 ${minority}번\n너도 핵봐 👉 ${SHARE_URL}`;
  const done = ()=>{
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove(); done();
}
function restart(){ startGame(); }
</script>

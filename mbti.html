<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🧬 반말방 MBTI 1탄</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --pink:#ff8fab; --pink-deep:#fb6f92; --pink-soft:#ffc2d1; --pink-bg:#fff0f3;
    --brown:#5c4a4a; --gold:#ffb703; --purple:#b565d8;
  }
  body {
    font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;
    background:linear-gradient(160deg,#ffe5ec 0%,#fff0f3 45%,#fff8f0 100%);
    min-height:100vh; color:var(--brown); overflow-x:hidden;
    display:flex; justify-content:center;
  }
  #app { width:100%; max-width:520px; padding:20px 16px 60px; position:relative; z-index:2; }
  .floating-hearts { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .floating-hearts span { position:absolute; bottom:-40px; font-size:20px; opacity:.35; animation:floatUp linear infinite; }
  @keyframes floatUp {
    0% { transform:translateY(0) rotate(0deg); opacity:0; } 10% { opacity:.4; }
    90% { opacity:.35; } 100% { transform:translateY(-110vh) rotate(30deg); opacity:0; }
  }
  .card-box {
    background:rgba(255,255,255,.92); border-radius:28px; padding:28px 22px;
    box-shadow:0 8px 32px rgba(251,111,146,.18), 0 2px 8px rgba(251,111,146,.10);
    backdrop-filter:blur(6px);
  }
  .screen { display:none; animation:pop .35s ease; }
  .screen.active { display:block; }
  @keyframes pop { from { transform:scale(.96) translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
  h1 { text-align:center; font-size:26px; margin:14px 0 6px; color:var(--pink-deep); letter-spacing:-.5px; }
  .title-emoji { font-size:56px; text-align:center; animation:beat 1.4s ease infinite; }
  @keyframes beat { 0%,100%{transform:scale(1);} 12%{transform:scale(1.15);} 24%{transform:scale(1);} 36%{transform:scale(1.12);} 48%{transform:scale(1);} }
  .subtitle { text-align:center; font-size:14px; color:#a17887; line-height:1.7; margin-bottom:22px; }
  .btn {
    display:block; width:100%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--pink) 0%,var(--pink-deep) 100%);
    color:#fff; font-size:18px; font-weight:700; padding:16px;
    border-radius:999px; box-shadow:0 6px 18px rgba(251,111,146,.45);
    transition:transform .12s ease; font-family:inherit;
  }
  .btn:active { transform:scale(.96); }
  .btn.secondary { background:#fff; color:var(--pink-deep); border:2px solid var(--pink-soft); box-shadow:none; }

  /* 진행바 */
  .progress-wrap { margin-bottom:16px; }
  .progress-label { display:flex; justify-content:space-between; font-size:13px; color:#b0828f; margin-bottom:6px; font-weight:600; }
  .progress-bar { height:12px; background:#ffe0e8; border-radius:999px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--purple),var(--pink-deep)); transition:width .4s ease; }

  /* 문항 */
  .q-text { text-align:center; font-size:18px; font-weight:800; line-height:1.5; margin-bottom:18px; word-break:keep-all; }
  .opt {
    display:block; width:100%; background:#fff; border:3px solid var(--pink-soft);
    border-radius:22px; padding:20px 18px; cursor:pointer; font-family:inherit;
    font-size:16px; font-weight:700; color:var(--brown); line-height:1.55;
    transition:all .15s ease; text-align:center; word-break:keep-all;
  }
  .opt:hover { border-color:var(--pink); background:var(--pink-bg); transform:translateY(-2px); box-shadow:0 8px 20px rgba(251,111,146,.2); }
  .opt:active { transform:scale(.97); }
  .opt-gap { height:12px; }

  /* 결과: 타입 */
  .type-letters { display:flex; justify-content:center; gap:10px; margin:10px 0 4px; }
  .type-letter {
    width:56px; height:64px; border-radius:16px; background:linear-gradient(135deg,var(--pink) 0%,var(--pink-deep) 100%);
    color:#fff; font-size:32px; font-weight:900; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(251,111,146,.35); animation:pop .4s ease backwards;
  }
  .type-letter:nth-child(2) { animation-delay:.08s; } .type-letter:nth-child(3) { animation-delay:.16s; } .type-letter:nth-child(4) { animation-delay:.24s; }
  .type-letter-sub { display:flex; justify-content:center; gap:10px; margin-bottom:12px; }
  .type-letter-sub span { width:56px; text-align:center; font-size:11px; font-weight:700; color:#b0828f; }
  .type-name { text-align:center; font-size:24px; font-weight:900; color:var(--pink-deep); margin:4px 0 8px; }
  .type-desc { text-align:center; font-size:14px; color:#8a6a75; line-height:1.7; margin-bottom:18px; word-break:keep-all; }

  /* 축 게이지 */
  .axis-list { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .axis-row { background:var(--pink-bg); border-radius:16px; padding:10px 14px; }
  .axis-heads { display:flex; justify-content:space-between; font-size:13px; font-weight:800; margin-bottom:6px; }
  .axis-heads .p1 { color:var(--purple); } .axis-heads .p2 { color:var(--pink-deep); }
  .axis-bar { height:10px; background:#fff; border-radius:999px; overflow:hidden; }
  .axis-fill { height:100%; background:linear-gradient(90deg,var(--purple),var(--pink-deep)); border-radius:999px; transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .axis-note { text-align:center; font-size:12px; color:#b0828f; margin-top:5px; font-weight:600; }

  /* 결과: 멤버 매칭 */
  .match-title { text-align:center; font-size:15px; font-weight:800; color:#a17887; margin:6px 0 10px; }
  .match-card {
    background:linear-gradient(135deg,#fff 0%,var(--pink-bg) 100%); border:2px solid var(--gold);
    border-radius:20px; padding:18px; text-align:center; margin-bottom:12px;
  }
  .match-emoji { font-size:44px; }
  .match-name { font-size:20px; font-weight:900; margin:4px 0; }
  .match-same { font-size:13px; font-weight:800; color:var(--pink-deep); margin-bottom:6px; }
  .match-blurb { font-size:13px; color:#8a6a75; line-height:1.6; word-break:keep-all; }
  .chem-row { display:flex; gap:10px; margin-bottom:18px; }
  .chem-box { flex:1; background:#fff; border:2px solid var(--pink-soft); border-radius:16px; padding:12px 10px; text-align:center; }
  .chem-label { font-size:12px; font-weight:800; color:#b0828f; margin-bottom:4px; }
  .chem-member { font-size:14px; font-weight:800; }
  .chem-sub { font-size:11px; color:#b0828f; margin-top:2px; font-weight:600; }

  .btn-row { display:flex; flex-direction:column; gap:10px; }
  .toast {
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:var(--brown); color:#fff; padding:12px 22px; border-radius:999px;
    font-size:14px; font-weight:600; opacity:0; transition:opacity .3s; z-index:99; pointer-events:none;
  }
  .toast.show { opacity:.95; }
</style>

      <div style="height:10px"></div>

      </div>
      <div class="btn-row">

        <button class="btn secondary" onclick="restart()">🔁 다시 하기</button>
        <button class="btn secondary" onclick="location.href='index.html'">💛 퀴즈 1탄</button>
        <button class="btn secondary" onclick="location.href='worldcup.html'">💘 이상형 월드컵 1탄</button>
        <button class="btn secondary" onclick="location.href='balance.html'">😈 밸런스 게임 1탄</button>
      </div>
    </div>

</div>

const SHARE_URL = 'https://bangmal-quiz.vercel.app/mbti.html';
const AXIS_LETTER1 = {O:'O', V:'V', D:'D', N:'N'};
const AXIS_LETTER2 = {O:'J', V:'T', D:'R', N:'M'};

let order = [], cur = 0, answers = [];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

(function(){
  const box = document.getElementById('hearts');
  const emo = ['🧬','💜','🩷','💖','✨','🔮'];
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.textContent = emo[i%emo.length];
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (9+Math.random()*10)+'s';
    s.style.animationDelay = (-Math.random()*12)+'s';
    s.style.fontSize = (14+Math.random()*18)+'px';
    box.appendChild(s);
  }
})();

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startGame(){
  order = DATA.questions.map((q,i)=>i); // 축 순서 유지 (셔플 안 함 — 축별 측정 느낌 살리기)
  cur = 0; answers = [];
  show('screen-quiz');
  renderQ();
}

function renderQ(){
  const q = DATA.questions[order[cur]];
  document.getElementById('q-num').textContent = `${cur+1} / ${order.length}`;
  const pct = Math.round(cur/order.length*100);
  document.getElementById('q-pct').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('opt-a').textContent = q.a;
  document.getElementById('opt-b').textContent = q.b;
}

function pick(side){
  answers.push(side);
  cur++;
  if(cur>=order.length){ showResult(); return; }
  renderQ();
}

function axisCounts(){
  // 축별 a(앞극) 개수 0~3
  const counts = {};
  DATA.axes.forEach((ax, ai)=>{
    let n = 0;
    for(let i=0;i<order.length;i++){
      if(DATA.questions[order[i]].axis === ax.id && answers[i] === 'a') n++;
    }
    counts[ax.id] = n;
  });
  return counts;
}

function myCode(counts){
  return DATA.axes.map(ax=> counts[ax.id]>=2 ? AXIS_LETTER1[ax.id] : AXIS_LETTER2[ax.id]).join('');
}

function memberDistances(){
  // 유저 답안지 vs 멤버 답안지 (문항 id 기준으로 정렬해 비교)
  const mineById = {};
  order.forEach((qi,i)=>{ mineById[DATA.questions[qi].id] = answers[i]; });
  return DATA.members.map(m=>{
    let d = 0;
    m.answers.forEach((a, i)=>{ if(a !== mineById[i+1]) d++; });
    return {...m, dist: d, same: 12 - d};
  }).sort((x,y)=> x.dist - y.dist);
}

function showResult(){
  const counts = axisCounts();
  const code = myCode(counts);
  const type = DATA.types[code];
  const ranking = memberDistances();
  const soul = ranking[0];
  const chem = ranking[1];
  const worst = ranking[ranking.length-1];

  document.getElementById('type-emoji').textContent = type.emoji;
  document.getElementById('type-letters').innerHTML = code.split('').map(l=>`<div class="type-letter">${l}</div>`).join('');
  document.getElementById('type-letter-sub').innerHTML = DATA.axes.map((ax,i)=>{
    const pole = code[i]===AXIS_LETTER1[ax.id] ? ax.pole1 : ax.pole2;
    return `<span>${pole}</span>`;
  }).join('');
  document.getElementById('type-name').textContent = `${type.emoji} ${type.name}`;
  document.getElementById('type-desc').textContent = type.desc;

  document.getElementById('axis-list').innerHTML = DATA.axes.map(ax=>{
    const n = counts[ax.id];
    const pct = Math.round(n/3*100);
    const note = n>=2 ? `${ax.pole1} ${n}/3` : `${ax.pole2} ${3-n}/3`;
    return `<div class="axis-row">
      <div class="axis-heads"><span class="p1">${ax.pole1}</span><span class="p2">${ax.pole2}</span></div>
      <div class="axis-bar"><div class="axis-fill" style="width:${Math.max(pct,8)}%"></div></div>
      <div class="axis-note">${note}</div>
    </div>`;
  }).join('');

  document.getElementById('match-emoji').textContent = soul.emoji;
  document.getElementById('match-name').textContent = soul.name;
  document.getElementById('match-same').textContent = `12문항 중 ${soul.same}개 일치 💘`;
  document.getElementById('match-blurb').textContent = soul.blurb;
  document.getElementById('chem-good').textContent = `${chem.emoji} ${chem.name.split(' ')[0]}`;
  document.getElementById('chem-good-sub').textContent = `${chem.same}개 일치`;
  document.getElementById('chem-bad').textContent = `${worst.emoji} ${worst.name.split(' ')[0]}`;
  document.getElementById('chem-bad-sub').textContent = `${worst.same}개 일치`;

  show('screen-result');
}

function copyResult(){
  const counts = axisCounts();
  const code = myCode(counts);
  const type = DATA.types[code];
  const soul = memberDistances()[0];
  const text = `🧬 반말방 MBTI 1탄\n내 타입: ${code} — ${type.emoji} ${type.name}\n우리 방 소울메이트: ${soul.emoji} ${soul.name} (12개 중 ${soul.same}개 일치)\n너도 핵봐 👉 ${SHARE_URL}`;
  const done = ()=>{
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove(); done();
}
function restart(){ startGame(); }
